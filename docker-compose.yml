services:
  api:
    build: .
    env_file: .env
    ports: ["8000:8000"]
    volumes: ["pt-data:/data"]
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
  n8n:
    image: n8nio/n8n:latest
    env_file: .env
    environment:
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
    ports: ["5678:5678"]
    volumes: ["n8n-data:/home/node/.n8n", "./n8n:/workflows:ro"]
    depends_on: [api]
volumes:
  pt-data:
  n8n-data:
